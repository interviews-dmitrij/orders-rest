name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ci-secret-not-used
      # Mirrors `.env` defaults so `symfony php` (which re-reads `.env`) and the
      # workflow env stay consistent.
      DATABASE_URL: "postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            php8.4-cli php8.4-mbstring php8.4-intl php8.4-xml \
            php8.4-pgsql php8.4-bcmath php8.4-curl
          sudo update-alternatives --set php /usr/bin/php8.4
          php -v

      - name: Install Symfony CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/symfony/stable/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y -qq symfony-cli
          symfony version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test database
        run: composer db:test:reset

      - name: Run composer check
        run: composer check
